name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # uv, not pip: [tool.uv.sources] is uv-only, pip would look for
      # kirocrew on PyPI (it isn't there) and fail.
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install package + deps
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/ -v