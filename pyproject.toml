[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-provider"
version = "0.1.0"
description = "OpenCode ACP backend for KiroCrew — monkey-patches at runtime, no source diffs"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "kirocrew",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
gateway = "gateway:_entry"

# Renovate reads the tag from here (github-tags datasource) and bumps it.
# A PEP 508 `pkg @ git+...` in project.dependencies is invisible to it.
[tool.uv.sources]
kirocrew = { git = "https://github.com/kirodotdev/KiroCrew.git", tag = "v0.3.0" }

[tool.setuptools]
packages = ["opencode_provider"]
py-modules = ["gateway"]