[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-provider"
version = "0.1.0"
description = "OpenCode ACP backend for KiroCrew"
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
    "kirocrew",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio>=0.23",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "black==26.5.1",
    "isort==9.0.1",
    "flake8==7.3.0",
    "Flake8-pyproject==1.2.4",
    "mypy==2.3.1",
]

[project.scripts]
gateway = "gateway:_entry"

# Renovate reads the tag from here (github-tags datasource) and bumps it.
# A PEP 508 `pkg @ git+...` in project.dependencies is invisible to it.
[tool.uv.sources]
kirocrew = { git = "https://github.com/kirodotdev/KiroCrew.git", tag = "v0.6.0" }

[tool.setuptools]
packages = ["opencode_provider"]
py-modules = ["gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--verbose",
    "--cov=opencode_provider",
    "--cov-report=term-missing",
    "-n=auto"
]

[tool.coverage.run]
source = ["opencode_provider"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/generated/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "pass",
]

[tool.black]
line-length = 100
target-version = ["py314"]
src = ["opencode_provider/", "tests/"]

[tool.isort]
profile = "black"
src_paths = ["opencode_provider/", "tests/"]
line_length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = [
    "E203",  # whitespace before ':'
    "E266",  # too many leading '#' for block comment
    "E501",  # line too long (handled by black)
    "W503",  # line break before binary operator
    "W504",  # line break after binary operator
]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    ".eggs",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    ".coverage",
    "htmlcov",
]
per-file-ignores = [
    "__init__.py:F401",  # imported but unused
]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "C90", # mccabe complexity
]

[tool.mypy]
check_untyped_defs = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
files = ["opencode_provider/", "tests/"]
exclude = [
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "htmlcov",
]

# This package exists to monkey-patch kiro_crew: it rebinds upstream methods and
# reads attributes install() grafts on at runtime. Both are invisible to mypy
# reading the installed upstream, so the two codes are noise here, not signal.
[[tool.mypy.overrides]]
module = "opencode_provider.*"
disable_error_code = ["method-assign", "attr-defined"]

# Tests build a fake kiro_crew tree out of types.ModuleType and assign onto it.
[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["attr-defined", "var-annotated"]
